<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Julian Bowen and Jerith Gurusubburam" />
    <meta name="description" content="Concert details and reviews." />
    <title>Concert | Concert Quest</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/concert-detail.css" />
    <link rel="stylesheet" href="css/reviews.css" />
    <link rel="stylesheet" href="css/passcode-dialog.css" />
    <script type="module" src="js/concert.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="index.html">Concert Quest</a>
      <nav class="site-header__nav">
        <a href="index.html">Concerts</a>
        <a href="concert-form.html">Post a concert</a>
      </nav>
    </header>
    <main class="page">
      <!-- concert.html?id=<concertId> -->
      <article class="concert-detail" id="concert-detail">
        <p role="status">Loading concert…</p>
      </article>

      <section class="reviews" id="reviews" aria-labelledby="reviews-heading">
        <h2 id="reviews-heading">Reviews</h2>
        <ul class="reviews__list" id="review-list"></ul>
        <form class="review-form" id="review-form">
          <label class="review-form__field">
            Your name
            <input name="reviewerName" maxlength="100" required />
          </label>
          <label class="review-form__field">
            Rating
            <select name="rating" required>
              <option value="" disabled selected>Choose a rating</option>
              <option value="5">5 – Excellent</option>
              <option value="4">4 – Good</option>
              <option value="3">3 – Average</option>
              <option value="2">2 – Poor</option>
              <option value="1">1 – Terrible</option>
            </select>
          </label>
          <label class="review-form__field">
            Review
            <textarea
              name="comment"
              rows="4"
              maxlength="5000"
              required
            ></textarea>
          </label>
          <label class="review-form__field">
            Passcode
            <input
              name="passcode"
              type="password"
              required
              minlength="4"
              autocomplete="new-password"
              aria-describedby="review-passcode-hint"
            />
          </label>
          <p class="review-form__hint" id="review-passcode-hint">
            You'll need this to edit or delete your review later.
          </p>
          <p class="review-form__error" role="alert"></p>
          <button type="submit">Post review</button>
        </form>
      </section>
    </main>

    <dialog class="passcode-dialog" id="passcode-dialog">
      <form method="dialog">
        <p class="passcode-dialog__message" id="passcode-message"></p>
        <label>
          Passcode
          <input type="password" name="passcode" required />
        </label>
        <menu class="passcode-dialog__actions">
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="confirm">Confirm</button>
        </menu>
      </form>
    </dialog>
    <footer class="site-footer">
      <p>Built for CS5610 by Julian Bowen and Jerith Gurusubburam.</p>
    </footer>
  </body>
</html>
